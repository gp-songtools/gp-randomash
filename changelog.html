<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="dice.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Randomash — Changelog</title>
<meta name="description" content="What changed in Randomash, newest first.">
<meta name="theme-color" content="#142e2b">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#releases">Skip to releases</a>
<header class="site-header">
  <nav class="site-nav shell" aria-label="Site">
    <a class="brand" href="./"><img src="dice.svg" alt="" width="34" height="34"> Randomash</a>
    <a href="./">Open workspace</a>
  </nav>
</header>
<main id="releases" class="shell releases" tabindex="-1">
<h1>Changelog</h1>
<p class="sub"><span id="intro">What changed in Randomash, newest first.</span></p>
<div id="log" aria-live="polite"><p class="msg">Loading…</p></div>
</main>
<script>
// Renders CHANGELOG.md (the single source of truth) next to this page.
(function () {
  const log = document.getElementById("log");
  const dateFormat = new Intl.DateTimeFormat("en-US", { dateStyle: "medium", timeZone: "UTC" });
  const TAGS = { added: ["new", "New"], changed: ["chg", "Changed"], fixed: ["fix", "Fixed"], removed: ["chg", "Removed"] };
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  // Inline markdown on already-escaped text: `code`, **bold**, *italic*, [text](url).
  function inline(s) {
    const codes = [];
    s = esc(s).replace(/`([^`]+)`/g, (_, c) => (codes.push(c), "\u0000" + (codes.length - 1) + "\u0000"));
    s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
         .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<i>$2</i>")
         .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) =>
           /^(https?:\/\/|\.?\/|#|[\w.-]+(\.\w+)?$)/.test(u) ? `<a href="${u}">${t}</a>` : t)
         .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2">$2</a>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
  }
  function niceDate(d) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    return m ? dateFormat.format(new Date(d + "T00:00:00Z")) : d;
  }
  function render(md) {
    const out = [], intro = [];
    let sec = null, tag = null, item = null, sub = null;
    const close = () => { item = null; sub = null; };
    for (const raw of md.replace(/\r/g, "").split("\n")) {
      const line = raw.trimEnd();
      let m;
      if (/^#\s/.test(line)) continue;
      if ((m = /^##\s+(.*)$/.exec(line))) {
        close(); tag = null;
        const [, date, title] = /^(\d{4}-\d{2}-\d{2})?\s*(?:[—–-]\s*)?(.*)$/.exec(m[1]);
        sec = { date: date || "", title: title || "", body: [] };
        out.push(sec); continue;
      }
      if (!sec) { if (line) intro.push(line); continue; }
      if ((m = /^###\s+(.*)$/.exec(line))) {
        close();
        const k = m[1].trim().toLowerCase();
        tag = TAGS[k] || ["chg", m[1].trim()];
        continue;
      }
      if ((m = /^- (.*)$/.exec(line))) {
        item = { tag, text: m[1], subs: [] }; sub = null;
        sec.body.push(item); continue;
      }
      if (item && (m = /^\s{2,}- (.*)$/.exec(line))) { sub = { text: m[1] }; item.subs.push(sub); continue; }
      if (item && /^\s{2,}\S/.test(line)) { (sub || item).text += " " + line.trim(); continue; }
      if (!line) { close(); continue; }
      sec.body.push({ para: line });
    }
    if (!out.length) throw new Error("No entries found");
    let html = "";
    out.forEach((s, i) => {
      const id = (s.date || "entry") + (out.slice(0, i).some(o => o.date === s.date) ? "-" + i : "");
      html += `<section><h2 id="${esc(id)}"><span class="ver"><span class="v">${inline(s.title || niceDate(s.date))}</span>`;
      if (s.title && s.date) html += `<time datetime="${esc(s.date)}">${esc(niceDate(s.date))}</time>`;
      if (i === 0) html += `<span class="cur">Latest</span>`;
      html += `</span></h2>`;
      let category = null;
      for (const b of s.body) {
        if (b.para) {
          if (category) { html += "</ul>"; category = null; }
          html += `<p>${inline(b.para)}</p>`;
          continue;
        }
        const [cls, label] = b.tag || ["chg", "Note"];
        if (category !== label) {
          if (category) html += "</ul>";
          html += `<h3 class="tag ${cls}">${esc(label)}</h3><ul>`;
          category = label;
        }
        html += `<li>${inline(b.text)}`;
        if (b.subs.length) html += "<ul>" + b.subs.map(x => `<li>${inline(x.text)}</li>`).join("") + "</ul>";
        html += "</li>";
      }
      if (category) html += "</ul>";
      html += "</section>";
    });
    if (intro.length) document.getElementById("intro").innerHTML = intro.map(inline).join(" ");
    log.innerHTML = html;
    if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }
  fetch("CHANGELOG.md", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(render)
    .catch(e => {
      log.innerHTML = '<p class="msg">The changelog couldn’t be loaded ({ERR}). <a href="https://github.com/gp-songtools/gp-randomash/blob/main/CHANGELOG.md">View it on GitHub</a>.</p>'.replace("{ERR}", esc(String(e.message || e)));
    });
})();
</script>
